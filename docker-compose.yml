services:
  postgres:
    image: postgres:17-alpine
    container_name: expense-manager-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: expense
      POSTGRES_PASSWORD: expense
      POSTGRES_DB: expense_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgres/data
volumes:
  postgres_data:
